<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Sistema Médico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="login-title">

      <div class="tabs" role="tablist" aria-label="Tipo de acesso">
        <button class="tab is-active" role="tab" id="tab-paciente" aria-selected="true"
                aria-controls="login-panel" data-perfil="paciente" type="button">Paciente</button>
        <button class="tab" role="tab" id="tab-cuidador" aria-selected="false"
                aria-controls="login-panel" data-perfil="cuidador" type="button" tabindex="-1">Cuidador</button>
        <button class="tab" role="tab" id="tab-farmaceutico" aria-selected="false"
                aria-controls="login-panel" data-perfil="farmaceutico" type="button" tabindex="-1">Farmacêutico</button>
      </div>

      <form class="login-form" id="login-panel" role="tabpanel" aria-labelledby="tab-paciente" novalidate>
        <h1 class="login-title" id="login-title">Entrar</h1>

        <div class="field">
          <label class="sr-only" for="cpf">CPF</label>
          <input class="input" type="text" id="cpf" name="cpf" placeholder="CPF"
                 inputmode="numeric" autocomplete="off" maxlength="14" required
                 aria-describedby="cpf-erro">
          <p class="field-error" id="cpf-erro" role="alert" hidden></p>
        </div>

        <div class="field">
          <label class="sr-only" for="nascimento">Data de nascimento</label>
          <input class="input" type="text" id="nascimento" name="nascimento" placeholder="Data de nascimento"
                 inputmode="numeric" autocomplete="bday" maxlength="10" required
                 aria-describedby="nascimento-dica nascimento-erro">
          <p class="field-hint" id="nascimento-dica">Digite apenas os números</p>
          <p class="field-error" id="nascimento-erro" role="alert" hidden></p>
        </div>

        <button class="btn" type="submit">Entrar</button>
        <p class="form-status" id="form-status" role="status" hidden></p>
      </form>

    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
